name: Fetch supporter logos

# Downloads each supporter's logo from its own website into assets/supporters/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_logos.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 scripts/fetch_logos.py
      - name: Commit if changed
        run: |
          git add assets/supporters
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update supporter logos"
          git pull --rebase
          git push
